[package]
name = "pixel-buds"
version = "0.1.0"
edition = "2021"
authors = ["Tech Man Dan <dan.inman@hotmail.co.uk>"]
description = "Native Rust status bridge and controller for Google Pixel Buds Pro 2 on Omarchy"

[[bin]]
name = "pixel-buds"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
libc = "0.2"
hound = "3.5"
which = "7.0"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync", "signal"] }
futures = "0.3"
bluer = { version = "0.17", features = ["rfcomm", "bluetoothd"] }
maestro = { git = "https://github.com/qzed/pbpctrl", rev = "2620367a41f92135059f637d92a2e4f427abb44e" }
